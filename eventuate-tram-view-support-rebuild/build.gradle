
dependencies {
    api "org.springframework.boot:spring-boot-starter-webmvc:$springBootVersion"
    api "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"

    implementation "io.eventuate.messaging.kafka:eventuate-messaging-kafka-spring-producer:$eventuateMessagingKafkaVersion"
    implementation "io.eventuate.tram.core:eventuate-tram-spring-jdbc-kafka:$eventuateTramVersion"
    implementation "io.eventuate.tram.core:eventuate-tram-spring-events:$eventuateTramVersion"
    implementation "io.eventuate.tram.core:eventuate-tram-messaging-producer-common:$eventuateTramVersion"
    implementation "org.apache.commons:commons-lang3:$commonsLang3Version"
    implementation "commons-beanutils:commons-beanutils:$commonsBeanutilsVersion"

    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc-test:$springBootVersion"
    testRuntimeOnly "com.mysql:mysql-connector-j:$mysqlVersion"
    testRuntimeOnly "org.postgresql:postgresql:$postgresqlVersion"
}
